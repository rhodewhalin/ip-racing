<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12243f"/>
      <stop offset="1" stop-color="#070c16"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a57"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
  </defs>
  <!-- maskable 안전영역을 고려해 배경을 꽉 채운다 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 원근 도로 -->
  <polygon points="196,470 316,470 300,150 212,150" fill="url(#road)"/>
  <!-- 중앙 점선 -->
  <g fill="#e9eefb">
    <polygon points="250,440 262,440 261,400 251,400"/>
    <polygon points="252,360 260,360 259,326 253,326"/>
    <polygon points="253,296 259,296 258,268 254,268"/>
    <polygon points="254,244 258,244 257,220 255,220"/>
  </g>
  <!-- 결승 체커 밴드 -->
  <g>
    <rect x="212" y="150" width="88" height="26" fill="#e9eefb"/>
    <g fill="#0b1220">
      <rect x="212" y="150" width="22" height="13"/>
      <rect x="256" y="150" width="22" height="13"/>
      <rect x="234" y="163" width="22" height="13"/>
      <rect x="278" y="163" width="22" height="13"/>
    </g>
  </g>
  <!-- 카트(단순 실루엣) -->
  <g>
    <ellipse cx="256" cy="392" rx="60" ry="16" fill="#000" opacity="0.35"/>
    <rect x="214" y="330" width="84" height="54" rx="14" fill="#4da3ff"/>
    <rect x="232" y="312" width="48" height="30" rx="10" fill="#37d67a"/>
    <circle cx="256" cy="300" r="15" fill="#c9d4e6"/>
    <rect x="200" y="336" width="18" height="40" rx="6" fill="#101319"/>
    <rect x="294" y="336" width="18" height="40" rx="6" fill="#101319"/>
  </g>
</svg>
