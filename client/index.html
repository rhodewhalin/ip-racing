<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>IP Racing — 3D</title>
    <style>
      :root { --bg:#0b1220; --panel:#182236; --line:#2b3a57; --fg:#e8eefc; --accent:#4da3ff; --good:#37d67a; --bad:#ff5d6c; --warn:#ffb020; }
      * { box-sizing:border-box; font-family:system-ui,"Apple SD Gothic Neo",sans-serif; }
      html, body { margin:0; height:100%; background:#070c16; color:var(--fg); overflow:hidden; }
      /* 화면 전체를 채운다. 고정 1280x720 이었던 것을 뷰포트 기준으로 바꿈. */
      #app { width:100vw; height:100vh; position:relative; }
      #game { width:100%; height:100%; }
      .hidden { display:none !important; }

      .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(7,12,22,.86); }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 32px; width:540px; }
      h1 { margin:0 0 4px; font-size:28px; letter-spacing:1px; }
      .sub { color:#9fb0d0; margin:0 0 18px; font-size:13px; }
      input { width:100%; padding:11px 12px; margin:6px 0 12px; border-radius:9px; border:1px solid var(--line); background:#0f1830; color:var(--fg); font-size:15px; }
      button { padding:11px 16px; border:0; border-radius:9px; background:var(--accent); color:#04122b; font-weight:700; cursor:pointer; font-size:15px; }
      button.ghost { background:#25324c; color:var(--fg); }
      .row { display:flex; gap:10px; }
      .row button { flex:1; }
      .prow { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line); font-size:14px; }

      /* HUD */
      #hud { position:absolute; left:0; right:0; top:0; padding:16px 24px; display:flex; gap:clamp(14px,2.2vw,34px);
             pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.8); }
      #hud .cell { display:flex; flex-direction:column; }
      #hud .k { font-size:11px; color:#8ea3c8; letter-spacing:1px; }
      #hud .v { font-size:26px; font-weight:800; }
      #hudItem.ready { color:var(--warn); }
      #hudDrift.t1 { color:#66c2ff; } #hudDrift.t2 { color:#ff8a3d; } #hudDrift.t3 { color:#ff4d6d; }
      #hud .v { font-size:clamp(18px,1.9vw,30px); }
      #hud .k { font-size:clamp(9px,0.8vw,12px); }
      #standings { position:absolute; left:24px; top:clamp(84px,10vh,130px); pointer-events:none;
                   background:rgba(10,16,32,.72); border:1px solid var(--line);
                   border-radius:10px; padding:8px 12px; font-size:13px; min-width:190px; }
      #standings .srow { display:flex; justify-content:space-between; gap:12px; padding:2px 0; }
      #standings .me { color:var(--accent); font-weight:800; }
      #standings .bot { color:#8ea3c8; }
      #btnFull { position:absolute; right:78px; bottom:24px; background:rgba(10,16,32,.8);
                 color:var(--fg); border:1px solid var(--line); padding:8px 12px;
                 font-size:18px; border-radius:10px; }
      #btnMute { position:absolute; right:24px; bottom:24px; background:rgba(10,16,32,.8);
                 color:var(--fg); border:1px solid var(--line); padding:8px 12px;
                 font-size:18px; border-radius:10px; }
      #spinbanner { position:absolute; left:50%; top:22%; transform:translateX(-50%);
                    background:rgba(255,93,108,.92); color:#fff; font-weight:800;
                    padding:10px 20px; border-radius:12px; font-size:clamp(14px,1.5vw,20px);
                    pointer-events:none; box-shadow:0 6px 24px rgba(0,0,0,.5); }
      #minimap { position:absolute; right:24px; top:24px; background:rgba(10,16,32,.72);
                 border:1px solid var(--line); border-radius:10px; pointer-events:none; }
      #game { width:100%; height:100%; overflow:hidden; }
      #game canvas { display:block; width:100% !important; height:100% !important; }
      #hud.offtrack::after { content:"코스 이탈"; position:absolute; right:22px; top:18px;
             color:var(--warn); font-weight:800; font-size:18px; }

      /* 카운트다운 */
      #countdown { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
      #countnum { font-size:clamp(90px,14vw,190px); font-weight:900; color:#fff; text-shadow:0 6px 30px rgba(77,163,255,.9); }

      /* 퀴즈 — 우하단 카드. 레이스를 가리지 않는다. */
      .quiz-card { position:absolute; right:24px; bottom:88px; width:clamp(360px,30vw,520px);
                   background:rgba(16,24,44,.96); border:2px solid var(--line);
                   border-radius:14px; padding:14px 16px; }
      .quiz-card.escape { border-color:var(--bad); }
      .quiz-card.block  { border-color:var(--warn); }
      .quiz-card.item   { border-color:var(--accent); }
      .quiz-card.ok { border-color:var(--good); }
      .quiz-card.no { border-color:var(--bad); }
      #qkind { font-size:12px; color:#8ea3c8; font-weight:700; letter-spacing:1px; }
      #qtext { font-size:17px; font-weight:700; margin:6px 0 10px; line-height:1.35; }
      #qopts { display:flex; flex-direction:column; gap:6px; }
      .qopt { text-align:left; background:#25324c; color:var(--fg); font-weight:600; padding:9px 12px; }
      .qopt b { color:var(--accent); margin-right:8px; }
      .qopt.picked { background:var(--accent); color:#04122b; }
      .qopt:disabled { opacity:.55; cursor:default; }
      #qbar { height:6px; background:#0f1830; border-radius:5px; margin-top:10px; overflow:hidden; }
      #qfill { height:100%; width:100%; background:var(--accent); }

      /* 결과 */
      .score { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); }
      #reviewlist { max-height:280px; overflow:auto; margin:10px 0; }
      #reviewlist .q { border-bottom:1px solid var(--line); padding:10px 0; font-size:14px; }
      #reviewlist .q.wrong { background:rgba(255,93,108,.08); }
      .tag { font-size:11px; color:#8ea3c8; }
      .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:#25324c; }
      .badge.ok { background:rgba(55,214,122,.16); color:var(--good); }
      .badge.no { background:rgba(255,93,108,.16); color:var(--bad); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="cell"><span class="k">RANK</span><span class="v" id="hudRank">-</span></div>
        <div class="cell"><span class="k">LAP</span><span class="v" id="hudLap">-</span></div>
        <div class="cell"><span class="k">ITEM (Space)</span><span class="v" id="hudItem">—</span></div>
        <div class="cell"><span class="k">SPEED</span><span class="v" id="hudSpeed">0</span></div>
        <div class="cell"><span class="k">LAP TIME</span><span class="v" id="hudLapTime">0.0</span></div>
        <div class="cell"><span class="k">BEST</span><span class="v" id="hudBest">—</span></div>
        <div class="cell"><span class="k">DRIFT</span><span class="v" id="hudDrift">—</span></div>
      </div>

      <div id="standings" class="hidden"></div>
      <button id="btnMute" title="소리 켜기/끄기 (M)">🔊</button>
      <button id="btnFull" title="전체화면 (F)">⛶</button>
      <canvas id="minimap" width="240" height="160" class="hidden"></canvas>

      <div id="spinbanner" class="hidden"><span id="spintext"></span></div>

      <div id="countdown" class="hidden"><div id="countnum"></div></div>

      <!-- 퀴즈 -->
      <div id="quiz" class="quiz-card hidden">
        <div id="qkind"></div>
        <div id="qtext"></div>
        <div id="qopts"></div>
        <div id="qbar"><div id="qfill"></div></div>
      </div>

      <!-- 로비 -->
      <div id="lobby" class="overlay">
        <div class="card">
          <h1>IP RACING</h1>
          <p class="sub">지식재산권 <b>3D</b> 카트 레이싱 · 2~4인 · 3바퀴 · AI가 빈자리를 채웁니다<br><span style="color:#4da3ff">BUILD v10 · 스핀아웃 수정 · 벽 글자 수정</span></p>
          <input id="nick" placeholder="닉네임 (예: 특허왕)" maxlength="12" />
          <div class="row" id="startrow">
            <button id="btnCreate">게임 만들기</button>
            <button id="btnJoin" class="ghost">방 코드 입장</button>
          </div>
          <div id="joinbox" class="row hidden" style="align-items:center">
            <input id="code" placeholder="방 코드 6자리" maxlength="6" style="margin:0;text-transform:uppercase;letter-spacing:3px" />
            <button id="btnJoinGo" style="flex:0 0 auto">입장</button>
          </div>
          <div id="waiting" class="hidden">
            <p class="sub">방 코드: <b id="roomcode"></b></p>
            <div id="players"></div>
            <br />
            <button id="btnReady" style="width:100%">준비 완료</button>
          </div>
          <p class="sub" style="margin-top:14px">
            ↑ 가속 · <b>↓ 브레이크&후진</b> · ← → 조향 · <b>Shift</b> 드리프트 · <b>Space</b> 아이템 · 문제는 <b>1 2 3</b> · <b>M</b> 음소거 · <b>F</b> 전체화면
          </p>
          <p class="sub" id="lobbyMsg" style="margin:0"></p>
        </div>
      </div>

      <!-- 결과 -->
      <div id="result" class="overlay hidden">
        <div class="card">
          <h1>🏁 RESULT</h1>
          <div id="scores"></div>
          <h1 style="font-size:18px;margin-top:18px">🧠 IP REVIEW</h1>
          <div id="reviewlist"></div>
          <div class="row" style="margin-top:14px">
            <button id="btnRematch">🔁 다시 하기</button>
            <button id="btnQuit" class="ghost">나가기</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
