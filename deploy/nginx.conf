# IP RACING — static Vite client + reverse proxy to the Colyseus server.
#
# The KIPlay hub reverse-proxies /games/ip-racing/ to this container's :8080 and
# STRIPS the /games/ip-racing prefix first (see hub/server/server.mjs proxyHttp /
# wsTargetFor: path = pathname.slice(entry.url.length - 1)). So every request
# arrives here already relative to this server root:
#     browser  /games/ip-racing/matchmake/joinOrCreate/race
#       hub -> /matchmake/joinOrCreate/race
#       browser  wss /games/ip-racing/<processId>/<roomId>?sessionId=...
#       hub ->   ws  /<processId>/<roomId>?sessionId=...
#
# Colyseus 0.15 routes matchmaking at /matchmake/* (HTTP GET+POST) and each room
# ws connection at /<processId>/<roomId> (root-level, dynamic). The client bakes
# the /games/ip-racing prefix into those URLs (client/src/net.ts, from BASE_URL),
# the hub strips it, so Colyseus itself sees plain root paths — no rewrite needed
# on this side. We just have to split "static file" from "Colyseus" traffic.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Colyseus matchmaking (HTTP). GET /matchmake/<room>  (getAvailableRooms)
    # and POST /matchmake/<method>/<room>  (create / joinOrCreate / joinById).
    location /matchmake/ {
        proxy_pass http://server:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long-cache fingerprinted Vite build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Everything else. A room ws connection targets a dynamic /<processId>/<roomId>
    # path that we cannot enumerate, so we discriminate on the Upgrade header:
    # WebSocket handshakes go to the Colyseus server, plain GETs fall through to
    # the SPA. proxy_pass inside `if` is one of the officially supported uses of
    # `if` in a location; when it fires it fully handles the request and try_files
    # is skipped.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        if ($http_upgrade) {
            proxy_pass http://server:2567;
        }

        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
